[project]
name = "btc-trace"
version = "0.1.0"
description = "Heuristic Bitcoin fund tracing from OFAC-sanctioned addresses, using your own full node."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Edward Sampson-Blue" }]
dependencies = [
    "jsonschema>=4.18",
    "numpy>=2.0",
    "truststore>=0.10",
]

[project.scripts]
btc-trace = "btc_trace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_trace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
